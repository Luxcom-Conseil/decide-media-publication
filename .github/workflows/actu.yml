name: Histoires vraies d'argent - Actu

# Rubrique « actu » (agent/actu.py), test des 7 pistes décidé le 19/11/2026 : chaque nuit, 8 vidéos tirées de
# l'actualité du jour (flux RSS de la presse), selon la grille tournante, programmées dans le second compte Buffer
# entre 7 h 30 et 22 h (la série des histoires garde 12 h 30 et 20 h 30).
on:
  schedule:
    # 14 h 07 UTC (15 h 07 à Paris) : prépare les vidéos du LENDEMAIN (agent/actu.py, jour_cible). Le passage de
    # 2 h 07 démarrait avec 6 à 8 h de retard (20-23/11/2026) et tassait les créneaux du matin vers 11 h.
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      immediat:
        description: "Publier tout de suite (sinon : créneaux du calendrier)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actu
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 8 vidéos ; la première sort à 7 h 30 de Paris
    outputs:
      jour: ${{ steps.jour.outputs.jour }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: pip install -r requirements.txt
      - name: Jour à produire (fixé une fois pour les deux étapes)
        id: jour
        run: echo "jour=$(python -c 'from agent.actu import jour_cible; print(jour_cible())')" >> "$GITHUB_OUTPUT"
      - name: Fabriquer les vidéos du jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACTU_JOUR: ${{ steps.jour.outputs.jour }}
        run: python -m agent actu-produire
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actu
          path: |
            sortie/actu/
            etat/actu.json
          if-no-files-found: ignore
          retention-days: 7

  programmer:
    needs: produire
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # même file que les histoires, DECIDE MEDIA et Instagram : tous réécrivent la branche « medias » (GitHub Pages)
    concurrency:
      group: publication-reseaux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: actu
          path: .
      - name: Mettre en ligne et programmer dans Buffer
        env:
          BUFFER_API_KEY_HISTOIRES: ${{ secrets.BUFFER_API_KEY_HISTOIRES }}
          YOUTUBE_CLIENT_ID_HISTOIRES: ${{ secrets.YOUTUBE_CLIENT_ID_HISTOIRES }}
          YOUTUBE_CLIENT_SECRET_HISTOIRES: ${{ secrets.YOUTUBE_CLIENT_SECRET_HISTOIRES }}
          YOUTUBE_REFRESH_TOKEN_HISTOIRES: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HISTOIRES }}
          ACTU_JOUR: ${{ needs.produire.outputs.jour }}
          HISTOIRES_IMMEDIAT: ${{ (github.event_name == 'workflow_dispatch' && inputs.immediat) && '1' || '0' }}
        run: python -m agent actu-programmer
      - name: Enregistrer l'avancement
        if: always()
        run: |
          git config user.name "agent-publication"
          git config user.email "agent-publication@users.noreply.github.com"
          git add etat/actu.json
          if ! git diff --staged --quiet; then
            git commit -m "etat: actu du $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash
            git push
          fi
