name: Bilan des performances DECIDE MEDIA

on:
  schedule:
    # 02:00 UTC = 3 h à Paris en hiver : avant la production de 4 h 07, qui lit etat/performances.json.
    # Le lundi, le bilan de la semaine part aussi en issue attribuée au propriétaire (e-mail de GitHub).
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rapport:
        description: "Envoyer le bilan de la semaine même hors lundi"
        type: boolean
        default: false

concurrency:
  group: bilan-performances
  cancel-in-progress: false

permissions:
  contents: write   # pour enregistrer etat/performances.json
  issues: write     # pour le bilan de la semaine par e-mail

jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Relever les chiffres (lecture seule)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agent.bilan ${{ inputs.rapport && '--rapport' || '' }}

      - name: Enregistrer le bilan
        run: |
          git config user.name "agent-publication"
          git config user.email "agent-publication@users.noreply.github.com"
          git add etat/performances.json
          if ! git diff --staged --quiet; then
            git commit -m "etat: bilan des performances du $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash
            git push
          fi
