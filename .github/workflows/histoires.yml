name: Histoires vraies d'argent - production du jour

# Chaque matin : fabrique les vidéos du jour (partie 2 de la série d'hier, un « chiffre fou », partie 1 d'une nouvelle
# série), les met en ligne sur GitHub Pages et les programme dans le second compte Buffer (TikTok + YouTube),
# à 12 h 30, 18 h 30 et 20 h 30 (heure de Paris). L'avancement du catalogue est gardé dans etat/histoires.json.
on:
  schedule:
    - cron: "7 0 * * *"    # 0 h 07 UTC (1 h ou 2 h à Paris) : le 06/11, GitHub a démarré le passage avec 8 h de retard
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: histoires
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: pip install -r requirements.txt
      - name: Fabriquer les vidéos du jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m agent histoires-produire
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: histoires
          path: |
            sortie/histoires/
            etat/histoires.json
          if-no-files-found: ignore
          retention-days: 7

  programmer:
    needs: produire
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # même file que DECIDE MEDIA et Instagram : tous réécrivent la branche « medias » (GitHub Pages)
    concurrency:
      group: publication-reseaux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: histoires
          path: .
      - name: Mettre en ligne et programmer dans Buffer
        env:
          BUFFER_API_KEY_HISTOIRES: ${{ secrets.BUFFER_API_KEY_HISTOIRES }}
        run: python -m agent histoires-programmer
      - name: Enregistrer l'avancement
        if: always()
        run: |
          git config user.name "agent-publication"
          git config user.email "agent-publication@users.noreply.github.com"
          git add etat/histoires.json
          if ! git diff --staged --quiet; then
            git commit -m "etat: histoires vraies d'argent du $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash
            git push
          fi
