name: Publication DECIDE MEDIA

on:
  schedule:
    # Facebook et YouTube programment eux-mêmes : un passage le matin suffit (heures UTC, GitHub peut décaler un peu).
    # 04:45 UTC = 6 h 45 à Paris en été, 5 h 45 en hiver. Les passages de 08:45 et 11:45 ne font rien
    # si tout est déjà programmé : ils rattrapent un lot déposé en retard par le producteur.
    - cron: "45 4,8,11 * * *"
  workflow_dispatch:
    inputs:
      commande:
        description: "lots = passage normal ; verifier = tester les accès ; essai-video = fabriquer un Short sans publier ; perso-essai = fabriquer un Reel Instagram perso sans publier"
        type: choice
        options: [lots, verifier, essai-video, perso-essai]
        default: lots
      simulation:
        description: "Simulation (ne publie rien, affiche ce qui serait fait)"
        type: boolean
        default: false

# Jamais deux passages en même temps (sinon risque de double publication)
concurrency:
  group: publication-reseaux
  cancel-in-progress: false

permissions:
  contents: write   # pour enregistrer etat/ (journal des publications) dans le dépôt

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # fabrication de 6 Shorts (~5 min chacun) comprise
    steps:
      # Dernière version de main au démarrage, pas celle du déclenchement : un passage mis en file d'attente
      # derrière un autre (cron GitHub en retard + cron-job.org) doit voir le journal que l'autre vient d'enregistrer,
      # sinon il reprogramme des posts déjà programmés (doublons TikTok du 24/10/2026).
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion/package-lock.json

      - name: Polices des Shorts (émojis)
        run: sudo apt-get install -y -qq fonts-noto-color-emoji > /dev/null

      - run: pip install -r requirements.txt

      - name: Lancer l'agent
        env:
          SIMULATION: ${{ inputs.simulation }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_PERSO_TOKEN: ${{ secrets.INSTAGRAM_PERSO_TOKEN }}
          INSTAGRAM_PERSO_CLE: ${{ secrets.INSTAGRAM_PERSO_CLE }}
        run: python -m agent ${{ inputs.commande || 'lots' }}

      # Compte Instagram personnel : passe même si les lots ont échoué (les deux sont indépendants).
      # Ne fait rien hors des jours et heures de publication (config.yaml perso).
      - name: Instagram perso
        if: ${{ !cancelled() && (!inputs.commande || inputs.commande == 'lots') }}
        env:
          SIMULATION: ${{ inputs.simulation }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_PERSO_TOKEN: ${{ secrets.INSTAGRAM_PERSO_TOKEN }}
          INSTAGRAM_PERSO_CLE: ${{ secrets.INSTAGRAM_PERSO_CLE }}
        run: python -m agent perso

      - name: Short d'essai à télécharger
        if: inputs.commande == 'essai-video'
        uses: actions/upload-artifact@v4
        with:
          name: short-essai
          path: sortie/*.mp4

      - name: Reel Instagram perso d'essai à télécharger
        if: inputs.commande == 'perso-essai'
        uses: actions/upload-artifact@v4
        with:
          name: reel-perso-essai
          path: |
            sortie/*.mp4
            sortie/legende.txt

      - name: Enregistrer la mémoire de l'agent
        if: always()
        run: |
          git config user.name "agent-publication"
          git config user.email "agent-publication@users.noreply.github.com"
          git add etat/
          if ! git diff --staged --quiet; then
            git commit -m "etat: passage du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
