# Réglages de l'agent (rien de secret ici : les clés vont dans les « Secrets » GitHub).

fuseau_horaire: Europe/Paris

# Si l'agent n'a pas pu tourner (panne GitHub…), un post en retard de plus de N heures n'est PAS publié.
retard_max_heures: 24

# Nombre d'essais par réseau avant d'abandonner (un essai par passage, toutes les 2 heures).
tentatives_max: 3

# Noms acceptés pour le fichier qui décrit la publication (un Google Doc nommé « post » marche aussi).
fichiers_post: [post.txt, post.md, post]

ia:
  active: true            # Claude adapte le texte commun à chaque réseau (sauf si une version [reseau] est écrite à la main)
  modele: claude-opus-5-5
  effort: medium          # low = plus rapide/moins cher, high = plus soigné
  marque: "Luxcom Conseil"
  ton: >-
    Professionnel, chaleureux et concret. Expert en référencement local, proche des TPE/PME
    d'Angoulême et de Charente. Pas de superlatifs creux.
  consignes: ""           # ex. : "Toujours terminer par un appel à l'action vers le site."
  hashtags_max:
    facebook: 3
    instagram: 8
    linkedin: 4
    x: 2

meta:
  version_api: v25.0      # version de l'API Graph Facebook/Instagram

linkedin:
  version_api: "202608"   # format AAAAMM ; LinkedIn garde chaque version environ 1 an

youtube:
  visibilite_defaut: public   # public | unlisted | private
  categorie: "22"             # 22 = Personnes et blogs, 27 = Éducation, 28 = Science et technologie
  categorie_lots: "25"        # Shorts DECIDE MEDIA : 25 = Actualités et politique
  modele_valide: true         # modèle motion design validé par Stéphane le 21/10/2026 (sans voix, mélodie 10 %)

# Gabarit des Shorts : v1 = modèle validé le 21/10 ; v2 = pédagogique (script simplifié écrit par une IA, dessins
# animés, sous-titres). IA : gemini (gratuit, secret GEMINI_API_KEY) ou claude (payant, secret ANTHROPIC_API_KEY).
# Sans clé, quota épuisé ou script refusé au contrôle, v2 découpe l'article sans IA : la publication continue.
video:
  gabarit: v2                 # validé par Stéphane le 26/10/2026 (essais Gemini sur 3 articles du lot du 24/10)
  ia: gemini
  modele_gemini: gemini-3.8-flash

# Voix off des Shorts : Google Text-to-Speech (projet Google Cloud du compte de service Drive, API Text-to-Speech activée).
# Chirp 3 HD : 1 million de caractères gratuits par mois. Au plafond, les Shorts sortent sans voix jusqu'au mois suivant.
# Compteur : etat/voix.json. Prononciation des noms propres : lexique.csv (mot;prononciation).
voix:
  active: true                # Short d'essai validé par Stéphane le 24/10/2026 (le Short d'essai a toujours la voix)
  nom: fr-FR-Chirp3-HD-Schedar
  vitesse: 1.0                # 0.25 à 2.0
  plafond_mensuel: 900000     # caractères, marge de 10 % sous la gratuité

# X et LinkedIn passent par Buffer (plan gratuit, compte luxcom07@gmail.com). Identifiants des chaînes : adresse
# publish.buffer.com/channels/<id>. Les médias sont mis en ligne sur GitHub Pages (branche « medias »).
buffer:
  canaux:
    x_buffer: 6ad88f9c778b240e2f78d689          # X @Decide_Media
    linkedin_buffer: 6ad88ffd778b240e2f78dad7   # Page LinkedIn DECIDE MEDIA
    tiktok_buffer: 6ad8aefe778b240e2f7a1ffd     # TikTok @decide_media (Shorts seulement, mention IA)
  shorts_par_lot: 4            # les 4 premiers articles en Short, les 6 suivants en visuel

# Lots quotidiens DECIDE MEDIA (commande : python -m agent lots)
lots:
  dossier_drive: 1T_1QBeDbS1GIgHY2UsZsNnN3wJu5Cmwa   # « Article DECIDE MEDIA - Quotidien »
  # facebook = 10 visuels ; facebook_shorts = les 6 premiers Shorts en vidéo sur la Page (16 posts/jour)
  reseaux: [facebook, youtube, facebook_shorts, x_buffer, linkedin_buffer, tiktok_buffer]   # sans accès : ignoré
  max_par_lot:
    youtube: 10                # limite d'envoi constatée le 21/10 : 10 vidéos/jour ; au-delà, réessai le lendemain
    facebook_shorts: 6
    tiktok_buffer: 10          # TikTok : 10 Shorts/jour (demande de Stéphane le 21/10)
    x_buffer: 10               # Buffer gratuit : 10 posts en file d'attente par chaîne
    linkedin_buffer: 10
  # YouTube : un Short (visuel + voix off française) est fabriqué pour chaque article puis programmé
  # dans le planificateur YouTube (publication automatique, PC éteint ou non).
  # Facebook : dépôt dans son planificateur. LinkedIn (pas de planificateur dans l'API) : l'agent publie
  # lui-même à l'heure prévue, à 15 min près ; le PC doit donc être allumé aux heures de publication.
  jours_max: 0                 # 0 = seulement le lot du jour
  # Rattrapage (règle validée par Stéphane le 21/10) : un lot « backfill » par jour, du plus ancien au plus récent.
  # Avec un lot du jour : rattrapage sur Facebook seulement (10 visuels, créneaux intercalés).
  # Sans lot du jour : le rattrapage passe sur tous les réseaux, aux créneaux normaux.
  rattrapage:
    actif: true
    depuis: "2026-10-16"
    reseaux_avec_lot_du_jour: [facebook]
  fuseau_creneaux: Africa/Douala   # heures de publication pensées pour le lectorat camerounais
  creneaux: ["07:00", "08:30", "10:00", "11:30", "13:00", "14:30", "16:00", "17:30", "19:00", "20:30"]
  creneaux_par_reseau:         # Shorts Facebook : 45 min après le visuel du même article
    facebook_shorts: ["07:45", "09:15", "10:45", "12:15", "13:45", "15:15"]
    tiktok_buffer: ["07:15", "08:45", "10:15", "11:45", "13:15", "14:45", "16:15", "17:45", "19:15", "20:45"]
    # visuels du lot de rattrapage : 20 min après chaque visuel du lot du jour
    facebook_rattrapage: ["07:20", "08:50", "10:20", "11:50", "13:20", "14:50", "16:20", "17:50", "19:20", "20:50"]
  marge_minutes: 20
  ecart_minimum_minutes: 45
